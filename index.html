<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Product Website</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

header{
background:#111;
color:white;
padding:15px;
text-align:center;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card img{
width:100%;
border-radius:10px;
}

.button{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:#007bff;
color:white;
text-decoration:none;
border-radius:5px;
}

</style>
</head>

<body>

<header>
<h1>My Products</h1>
</header>

<div class="products">

<div class="card">
<img src="product1.jpg">
<h3>Dashcam A500S</h3>
<p>RM399</p>
<a class="button" href="product1.html">View Details</a>
</div>

<div class="card">
<img src="product2.jpg">
<h3>Dashcam R400S</h3>
<p>RM299</p>
<a class="button" href="product2.html">View Details</a>
</div>

</div>

</body>
</html>
